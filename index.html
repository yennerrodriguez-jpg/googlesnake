<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Snake Game Offline</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Center game and fix background */
        body { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            background: #8fa08e; /* Match the green background from your screenshot */
        }
        /* Fix the overlapping text from your screenshot */
        .gs-sub { line-height: 1.4; margin-bottom: 20px; }
        .gs-menu h3 { margin-top: 0; }
    </style>
</head>
<body>

    <!-- ADDED id="gsnake" HERE - THIS IS THE CRITICAL FIX -->
    <div class="gs-board" id="gsnake">
        <canvas class="gs-canvas" width="820" height="525" aria-label="Snake game board"></canvas>
        <div class="gs-overlay">
            <div class="gs-menu">
                <h3>Snake</h3>
                <p class="gs-sub">Eat the apples, grow longer, don’t bite yourself.</p>
                <div class="gs-over-msg">
                    <p data-gs-title="">Ready?</p>
                    <p data-gs-text="">Pick your settings and play.</p>
                </div>
                
                <div class="gs-group"><span>Board size</span>
                    <div class="gs-opts">
                        <button class="gs-opt" type="button" data-size="19x12">Small</button>
                        <button class="gs-opt gs-sel" type="button" data-size="25x16">Medium</button>
                        <button class="gs-opt" type="button" data-size="31x19">Large</button>
                    </div>
                </div>

                <div class="gs-group"><span>Speed</span>
                    <div class="gs-opts">
                        <button class="gs-opt" type="button" data-speed="180">Slow</button>
                        <button class="gs-opt gs-sel" type="button" data-speed="140">Normal</button>
                        <button class="gs-opt" type="button" data-speed="100">Fast</button>
                    </div>
                </div>

                <div class="gs-group"><span>Walls</span>
                    <div class="gs-opts">
                        <button class="gs-opt gs-sel" type="button" data-walls="on">On</button>
                        <button class="gs-opt" type="button" data-walls="off">Off (wrap)</button>
                    </div>
                </div>

                <button class="gs-play" type="button" data-gplay="">▶ Play</button>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
    <script src="google-snake.js"></script>
</body>
</html>
